# Smithery.ai / Glama.ai / PulseMCP Auto-Discovery Manifest
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      slidecraftApiKey:
        type: string
        description: "Optional SlideCraft Pro/Team License Key (leave empty for Free Tier: 3 free McKinsey Action-Title Deck generations per day)."
        default: ""
      workEmail:
        type: string
        description: "Optional corporate email (@company.com) to unlock instant <$50 No-Approval $29/mo Team Expense Invoice & Manager Slack pitch generation."
        default: ""
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@slidecraft/mcp-server'],
      env: {
        ...(config.slidecraftApiKey ? { SLIDECRAFT_API_KEY: config.slidecraftApiKey } : {}),
        ...(config.workEmail ? { SLIDECRAFT_WORK_EMAIL: config.workEmail } : {})
      }
    })
